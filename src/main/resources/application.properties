spring.application.name=webs26
spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/webs26?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:webs26}
spring.datasource.password=${DB_PASSWORD:webs26}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Verifica la corrispondenza con lo schema esistente senza modificarlo.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

springdoc.swagger-ui.path=/swagger-ui.html
